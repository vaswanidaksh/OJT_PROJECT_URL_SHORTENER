{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Error — ShortMe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<nav class="navbar">
  <div class="nav-left">
    <a href="{% url 'home' %}" class="logo">
      <img class="logo-img" src="{% static 'logo.png' %}" alt="ShortMe Logo">
      <span class="brand">ShortMe</span>
    </a>
  </div>
  <div class="nav-right">
    <a href="{% url 'login' %}" class="nav-btn login-btn">Login</a>
    <a href="{% url 'signup' %}" class="nav-btn signup-btn">Signup</a>
  </div>
</nav>

<main class="container">
  <div class="card wide error-card" style="text-align:center;">
    <h1 style="margin:0; color:var(--accent-purple);">Something went wrong</h1>
    <p class="muted" style="margin-top:12px;">{% if message %}{{ message }}{% else %}An unexpected error occurred. Please try again later.{% endif %}</p>
    <p style="margin-top:18px;"><a class="nav-item" href="{% url 'home' %}">Return home</a></p>
  </div>
</main>
</body>
</html>
