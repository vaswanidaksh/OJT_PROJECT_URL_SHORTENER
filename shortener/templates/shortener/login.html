{% load static %}
{% load socialaccount %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login — ShortMe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<nav class="navbar">
  <div class="nav-left">
    <a href="{% url 'home' %}" class="logo">
      <img class="logo-img" src="{% static 'logo.png' %}" alt="ShortMe Logo">
      <span class="brand">ShortMe</span>
    </a>
  </div>

  <div class="nav-right">
    <a href="{% url 'login' %}" class="nav-btn login-btn">Login</a>
    <a href="{% url 'signup' %}" class="nav-btn signup-btn">Signup</a>
  </div>
</nav>

<main class="container">
  <header style="text-align:center; margin-bottom:18px;">
    <h1 style="margin:0;">Sign In</h1>
    <p class="muted">Access your saved links and history.</p>
  </header>

  <div class="auth-card card">
    <form method="post" style="display:flex; flex-direction:column; gap:12px;">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn-shorten" type="submit">Sign In</button>
    </form>

    <a href="{% provider_login_url 'google' %}" class="btn-shorten" style="background: linear-gradient(90deg,var(--accent-cyan),var(--accent-purple)); margin-top:10px; display:inline-block; text-align:center;">
      Sign in with Google
    </a>

    <p class="auth-link">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
  </div>
</main>
</body>
</html>
